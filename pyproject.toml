[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-operations"
version = "1.2.0"
description = "Local Windows console for GitHub Actions runners, queues and job history"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Axionax", email = "191557105+axionaxprotocol@users.noreply.github.com" }]
keywords = ["github-actions", "ci", "dashboard", "windows", "runners"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
build = ["pyinstaller==6.22.3"]

[project.urls]
Homepage = "https://github.com/axionaxprotocol/ci-operations"
Issues = "https://github.com/axionaxprotocol/ci-operations/issues"
Changelog = "https://github.com/axionaxprotocol/ci-operations/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["ci_dashboard", "desktop_app", "desktop_history", "desktop_service", "desktop_setup", "desktop_store"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["B011"]
